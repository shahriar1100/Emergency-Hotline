<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="src/output.css" />
    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <!-- font awesome -->
    <!-- google gont -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- google gont -->
  </head>
  <body class="font-hindMadurai bg-white text-black">
    <!-- Heading part -->
    <section id="header">
      <header class="bg-white px-4 sm:px-6 md:px-10 lg:px-[60px]">
        <div
          class="flex flex-col md:flex-row justify-between items-center py-4 md:py-6 gap-4 md:gap-0 text-base"
        >
          <!-- Logo -->
          <div class="logoPart">
            <img
              class="w-32 sm:w-40 md:w-auto"
              src="assets/Logo.png"
              alt="Logo"
            />
          </div>

          <!-- Right Part -->
          <div
            class="rightPart flex flex-wrap justify-center md:justify-end items-center gap-3 sm:gap-4"
          >
            <!-- Heart -->
            <h3
              class="bg-[#41ff6a31] px-4 sm:px-6 md:px-9 py-2 sm:py-3 md:py-[14px] font-bold rounded-full text-sm sm:text-base"
            >
              0
              <i class="fa-solid fa-heart pl-2 text-red-600"></i>
            </h3>

            <!-- Coin -->
            <h3
              class="rounded-full bg-[#41ff6a31] px-3 sm:px-4 md:px-5 py-2 sm:py-3 md:py-[14px] flex items-center text-sm sm:text-base"
            >
              <span class="pr-2 font-bold">100</span>
              <img class="w-4 sm:w-5" src="assets/coin.png" alt="coin" />
            </h3>

            <!-- Button -->
            <button
              class="px-4 sm:px-6 md:px-9 py-2 sm:py-3 md:py-[14px] bg-[#00A63E] rounded-full text-sm sm:text-base text-white"
            >
              2 Copy
            </button>
          </div>
        </div>
      </header>
    </section>
    <!-- Heading part -->
     

    <script src="script.js"></script>
  </body>
</html>
